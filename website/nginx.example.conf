# Example nginx server block for the static ChaosGone site.
# Copy to /etc/nginx/sites-available/chaosgone, adapt server_name and root, then:
#   sudo ln -s /etc/nginx/sites-available/chaosgone /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d your-domain.tld -d www.your-domain.tld     # adds HTTPS and the redirect from http
#
# If this site shares the machine with other sites, use a dedicated root such as /var/www/chaosgone
# and deploy with WEBROOT=/var/www/chaosgone.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.tld www.your-domain.tld;

    root /var/www/html;
    index index.html;

    # Pretty 404
    error_page 404 /404.html;

    # Security headers. They are set once here; do not add add_header lines in the location
    # blocks below, nginx would then drop these (add_header is not inherited when a block sets its own).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The page loads nothing from other origins and uses no JavaScript.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;

    # Compression for text formats (images and woff2 are already compressed)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/json application/manifest+json application/xml image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ =404;
        expires 1h;                 # HTML: short cache so copy changes show up quickly
    }

    # Fingerprint-free but rarely changing assets: cache for a year.
    # If you replace a file, rename it or bump the ?v= in the HTML.
    location ~* \.(?:woff2|webp|png|svg|ico)$ {
        expires 1y;
        access_log off;
    }
    location /css/ {
        expires 1d;
    }

    # Keep the license texts of the fonts reachable but out of the way
    location = /sitemap.xml { expires 1d; }
    location = /robots.txt  { expires 1d; }
}
