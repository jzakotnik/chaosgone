# chaosgone.de: plain HTTP server block for the static site in /var/www/html.
# `certbot --nginx` adds the HTTPS listener, the certificate and the redirect from http to https by itself.
#
#   sudo cp chaosgone.de.conf /etc/nginx/sites-available/chaosgone.de
#   sudo ln -s /etc/nginx/sites-available/chaosgone.de /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d chaosgone.de -d www.chaosgone.de

server {
    listen 80;
    listen [::]:80;
    server_name chaosgone.de www.chaosgone.de;

    root /var/www/html;
    index index.html;
    error_page 404 /404.html;

    # Security headers. Keep them here and do not add add_header lines inside the location blocks below:
    # nginx would then drop these (add_header is not inherited once a block sets its own).
    # The site loads nothing from other origins and uses no JavaScript, so the policy can be strict.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/json application/manifest+json application/xml image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ =404;
        expires 1h;
    }

    # Rarely changing assets: cache for a year (rename a file if you replace it).
    location ~* \.(?:woff2|webp|png|svg|ico)$ {
        expires 1y;
        access_log off;
    }

    location /css/ {
        expires 1d;
    }

    # nginx does not know the .webmanifest extension; without this it is sent as text/plain.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
    }
}
