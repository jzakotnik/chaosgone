# Start:  docker compose up -d        (http://localhost:3000)
# Config: put ANTHROPIC_API_KEY etc. in a .env file next to this file (see .env.example) or export them.
services:
  chaosgone:
    image: jzakotnik/chaosgone:latest
    # Uncomment to build from this checkout instead of pulling the image:
    # build: .
    container_name: chaosgone
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      SITE_URL: ${SITE_URL:-}
    volumes:
      # SQLite database + photos. A named volume just works; to use a host folder instead write
      # "./data:/data" and run `mkdir data && sudo chown 1000:1000 data` once (the app runs as uid 1000).
      - chaosgone-data:/data

volumes:
  chaosgone-data:
